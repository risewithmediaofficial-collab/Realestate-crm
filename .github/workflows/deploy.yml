name: Deploy Real Estate CRM to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            TARGET_DIR="/docker/real-estate-crm"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "================================================="
            echo "🚀 Starting Deployment for Real Estate CRM"
            echo "================================================="

            # Remove existing conflicting containers before building
            echo "🛑 Stopping and removing previous containers..."
            docker rm -f realestate_crm_frontend realestate_crm_backend realestate_crm_db 2>/dev/null || true

            # Clone or update repository
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🔄 Updating repository at $TARGET_DIR..."
              cd "$TARGET_DIR" && git reset --hard HEAD && git clean -fd && git pull origin main
            else
              echo "📦 Cloning repository into $TARGET_DIR..."
              mkdir -p /docker && git clone "$REPO_URL" "$TARGET_DIR" && cd "$TARGET_DIR"
            fi

            # Ensure upload directories exist
            mkdir -p backend/uploads

            # Build and deploy containers
            echo "🐳 Starting Docker Compose build and container orchestration..."
            docker compose -p realestate-crm -f docker-compose.yml up -d --build

            # Prune dangling/unused images to preserve VPS disk space
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "================================================="
            echo "✅ Deployment completed successfully!"
            echo "================================================="
            docker compose -p realestate-crm -f docker-compose.yml ps
