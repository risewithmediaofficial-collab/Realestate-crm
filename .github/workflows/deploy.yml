name: Deploy Real Estate CRM to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "================================================="
            echo "🚀 Starting Deployment for Real Estate CRM"
            echo "================================================="

            # Detect directory if already cloned under realestate-crm or real-estate-crm
            TARGET_DIR="/docker/realestate-crm"
            if [ -d "/docker/realestate-crm/.git" ]; then
              TARGET_DIR="/docker/realestate-crm"
            elif [ -d "/docker/real-estate-crm/.git" ]; then
              TARGET_DIR="/docker/real-estate-crm"
            fi

            # Check if directory and git repository exist
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📦 Directory does not exist. Creating and cloning repository into $TARGET_DIR..."
              mkdir -p /docker
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "🔄 Existing repository found at $TARGET_DIR. Pulling latest commits from main..."
              cd "$TARGET_DIR"
              git reset --hard HEAD
              git clean -fd
              git pull origin main
            fi

            # Ensure upload directories exist on host
            mkdir -p backend/uploads

            # Stop and remove previous conflicting containers by name to prevent Docker conflict errors
            echo "🛑 Removing old conflicting containers if any..."
            docker rm -f realestate_crm_frontend realestate_crm_backend realestate_crm_db 2>/dev/null || true
            docker compose -p realestate-crm -f docker-compose.yml down --remove-orphans 2>/dev/null || true

            # Build and deploy containers with consistent project name
            echo "🐳 Starting Docker Compose build and container orchestration..."
            docker compose -p realestate-crm -f docker-compose.yml up -d --build

            # Prune dangling/unused images to preserve VPS disk space
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "================================================="
            echo "✅ Deployment completed successfully!"
            echo "================================================="
            docker compose -p realestate-crm -f docker-compose.yml ps
