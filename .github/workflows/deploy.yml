name: Deploy Real Estate CRM to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            TARGET_DIR="/docker/real-estate-crm"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "================================================="
            echo "🚀 Starting Deployment for Real Estate CRM"
            echo "================================================="

            # ── Step 1: Stop existing containers gracefully ──────
            echo "🛑 Stopping existing containers..."
            if [ -d "$TARGET_DIR" ]; then
              docker compose -p realestate-crm -f "$TARGET_DIR/docker-compose.yml" down --remove-orphans 2>/dev/null || true
            fi
            # Force-remove any lingering containers by name
            docker rm -f realestate_crm_frontend realestate_crm_backend realestate_crm_db 2>/dev/null || true

            # ── Step 2: Clone or update repository ───────────────
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🔄 Updating repository at $TARGET_DIR..."
              cd "$TARGET_DIR"
              git reset --hard HEAD
              git clean -fd
              git pull origin main
            else
              echo "📦 Cloning repository into $TARGET_DIR..."
              mkdir -p /docker
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            fi

            # ── All remaining commands run inside TARGET_DIR ──────
            cd "$TARGET_DIR"

            # ── Step 3: Ensure required directories exist ─────────
            echo "📁 Ensuring upload directories exist..."
            mkdir -p backend/uploads

            # ── Step 4: Build and start containers ───────────────
            echo "🐳 Building and starting Docker containers..."
            docker compose -p realestate-crm -f docker-compose.yml up -d --build

            # ── Step 5: Prune unused images to save disk space ────
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "================================================="
            echo "✅ Deployment completed successfully!"
            echo "================================================="
            docker compose -p realestate-crm -f docker-compose.yml ps
