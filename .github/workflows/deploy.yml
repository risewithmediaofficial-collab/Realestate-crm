name: Deploy Real Estate CRM to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            set -e

            TARGET_DIR="/docker/real-estate-crm"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "================================================="
            echo "🚀 Starting Deployment for Real Estate CRM"
            echo "================================================="

            # ── Step 1: Stop containers (safe — never fails the script) ──
            echo "🛑 Stopping existing containers..."
            docker stop realestate_crm_frontend realestate_crm_backend realestate_crm_db 2>/dev/null || true
            docker rm -f realestate_crm_frontend realestate_crm_backend realestate_crm_db 2>/dev/null || true
            echo "✔ Containers cleared"

            # ── Step 2: Clone or pull latest code ───────────────────────
            mkdir -p /docker
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🔄 Pulling latest code..."
              cd "$TARGET_DIR"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              echo "✔ Repository updated"
            else
              echo "📦 Cloning repository..."
              rm -rf "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
              echo "✔ Repository cloned"
            fi

            # ── Ensure we are in TARGET_DIR for all remaining steps ──────
            cd "$TARGET_DIR"
            echo "📂 Working directory: $(pwd)"

            # ── Step 3: Ensure upload directories exist ──────────────────
            mkdir -p backend/uploads
            echo "✔ Upload directories ready"

            # ── Step 4: Detect docker compose command ────────────────────
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi
            echo "🐳 Using compose command: $COMPOSE_CMD"

            # ── Step 5: Build and start containers ───────────────────────
            echo "🐳 Building and starting containers..."
            $COMPOSE_CMD -p realestate-crm -f docker-compose.yml up -d --build

            # ── Step 6: Prune unused images ───────────────────────────────
            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "================================================="
            echo "✅ Deployment completed successfully!"
            echo "================================================="
            $COMPOSE_CMD -p realestate-crm -f docker-compose.yml ps
